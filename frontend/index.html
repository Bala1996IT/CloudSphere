<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>CloudSphere</h1>

        <p class="subtitle">
            Agentic AI Platform for Heavy Oil IT
        </p>

        <h2>What would you like CloudSphere to do?</h2>

        <div class="prompt-container">

            <input
                type="text"
                id="userPrompt"
                placeholder="Ask CloudSphere..."
            >

            <button id="submitBtn">
                Send
            </button>

        </div>

        <div class="suggestions">

            <p>Show subscriptions</p>
            <p>Show resource groups</p>
            <p>List all VMs</p>
            <p>Show storage accounts</p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
