<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CloudSphere</h1>
        <p>Cloud Resource Management & Visibility Platform</p>
    </header>

    <main class="dashboard">

        <section class="card">
            <h2>Virtual Machines</h2>
            <p id="vm-count">0</p>
        </section>

        <section class="card">
            <h2>Applications</h2>
            <p id="app-count">0</p>
        </section>

        <section class="card">
            <h2>Storage Accounts</h2>
            <p id="storage-count">0</p>
        </section>

        <section class="card">
            <h2>Databases</h2>
            <p id="database-count">0</p>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
